---
layout: default
---
<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
    <ul class="plain-list">
      {% assign pubs = site.publications | sort: "date" | reverse %}
      {% for pub in pubs %}
        <li>{% include citation.html item=pub %}</li>
      {% endfor %}
    </ul>
  </div>
</article>
