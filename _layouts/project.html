---
layout: default
---
<article class="page">
  <header class="page-header">
    <p class="meta">{{ page.date | date: "%Y" }}</p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {% if page.summary %}<p>{{ page.summary }}</p>{% endif %}
    {% if page.external_link %}
      <p><a href="{{ page.external_link }}">Project page</a></p>
    {% endif %}
    {{ content }}
  </div>
</article>
