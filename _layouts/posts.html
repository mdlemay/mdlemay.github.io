---
layout: default
---
<article class="page">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
    <ul class="plain-list">
      {% for post in site.posts %}
        <li>
          <p class="citation">
            <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
            <span class="meta"> · {{ post.date | date: "%B %-d, %Y" }}</span>
          </p>
        </li>
      {% endfor %}
    </ul>
  </div>
</article>
