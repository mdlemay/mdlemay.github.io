<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Personal" href="{{ '/feed/personal.xml' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} — Professional" href="{{ '/feed/professional.xml' | relative_url }}">
    <link rel="icon" href="{{ '/assets/images/avatar.jpg' | relative_url }}" type="image/jpeg">
    {% seo %}
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    {% include header.html %}
    <main id="content" class="wrap">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
