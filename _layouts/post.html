---
layout: default
---
<article class="page">
  <header class="page-header">
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags %}
        · {{ page.tags | join: ", " }}
      {% endif %}
    </p>
    <h1>{{ page.title }}</h1>
  </header>
  {% if page.hero %}
    <figure class="hero-figure">
      <img src="{{ page.hero | relative_url }}" alt="{{ page.image_caption | default: page.title }}">
      {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
    </figure>
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
